[project]
name = "cashproof-ai"
version = "0.1.0"
description = "CashProof bounded AI investigation adapter"
requires-python = ">=3.12"
dependencies = [
    "cashproof-domain",
    "cashproof-application",
    "anthropic>=0.40.0",
    "google-genai>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashproof"]
