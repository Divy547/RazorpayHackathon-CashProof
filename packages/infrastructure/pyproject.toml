[project]
name = "cashproof-infrastructure"
version = "0.1.0"
description = "CashProof infrastructure adapters and storage"
requires-python = ">=3.12"
dependencies = [
    "cashproof-domain",
    "cashproof-application",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashproof"]
