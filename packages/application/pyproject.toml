[project]
name = "cashproof-application"
version = "0.1.0"
description = "CashProof application orchestration, use cases, and ports"
requires-python = ">=3.12"
dependencies = [
    "cashproof-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashproof"]
