[project]
name = "cashproof-api"
version = "0.1.0"
description = "CashProof HTTP API composition root"
requires-python = ">=3.12"
dependencies = [
    "cashproof-domain",
    "cashproof-application",
    "cashproof-infrastructure",
    "cashproof-ai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashproof"]
